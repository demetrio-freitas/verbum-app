<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Teste — Time Bar Opção A</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=DM+Sans:wght@300;400;500;600;700&family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,1,0&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAFAF7;
  --bg-card: #FFFFFF;
  --bg-elevated: #F2F1EC;
  --text-primary: #1C1917;
  --text-secondary: #57534E;
  --text-tertiary: #A8A29E;
  --accent: #78350F;
  --accent-soft: rgba(120,53,15,0.06);
  --gold: #B45309;
  --border: rgba(28,25,23,0.06);
  --font-display: 'Cormorant Garamond', serif;
  --font-body: 'DM Sans', -apple-system, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: var(--font-body);
  background: var(--bg);
  max-width: 430px;
  margin: 0 auto;
  padding: 20px;
}

.section-subtitle {
  font-size: 0.72rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--text-tertiary);
  margin-bottom: 16px;
}

/* =================== TIME BAR =================== */
.tb {
  display: flex;
  gap: 6px;
  margin-bottom: 20px;
}

.tb-item {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.tb-item.laudes { flex: 3; }
.tb-item.gap-mid { flex: 2; }
.tb-item.vesperas { flex: 3; }
.tb-item.completas { flex: 2; }

/* Label row */
.tb-label {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 0.65rem;
  font-weight: 600;
  color: var(--text-secondary);
  white-space: nowrap;
}
.tb-label .material-symbols-rounded { font-size: 14px; }
.tb-item.done .tb-label {
  color: var(--text-tertiary);
}
.tb-item.done .tb-label .material-symbols-rounded {
  color: var(--accent);
}
.tb-item.active .tb-label {
  color: var(--accent);
  font-weight: 700;
}

/* Segment bar */
.tb-seg {
  width: 100%;
  height: 6px;
  border-radius: 100px;
}
.tb-item.laudes .tb-seg { background: var(--accent); opacity: 0.3; }
.tb-item.laudes.done .tb-seg { opacity: 0.25; }
.tb-item.gap-mid .tb-seg { background: var(--bg-elevated); }
.tb-item.vesperas .tb-seg { background: var(--gold); opacity: 0.5; }
.tb-item.vesperas.active .tb-seg {
  opacity: 1;
  height: 8px;
  box-shadow: 0 0 0 2px var(--bg), 0 0 0 3.5px var(--gold);
}
.tb-item.completas .tb-seg { background: var(--text-tertiary); opacity: 0.25; }

/* Now indicator */
.tb-now {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  flex: 0 0 auto;
  width: 20px;
  align-self: stretch;
}
.tb-now-label {
  font-size: 0.48rem;
  font-weight: 800;
  color: var(--accent);
  text-transform: uppercase;
  letter-spacing: 0.05em;
}
.tb-now-dot {
  width: 10px;
  height: 10px;
  background: var(--accent);
  border: 2px solid var(--bg);
  border-radius: 50%;
  box-shadow: 0 0 0 2px var(--accent);
  margin-bottom: -1px;
}

/* Placeholder card */
.card-preview {
  padding: 16px 20px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  display: flex;
  align-items: center;
  gap: 14px;
}
.card-preview-icon {
  width: 42px; height: 42px;
  border-radius: 50%;
  background: var(--accent-soft);
  display: flex; align-items: center; justify-content: center;
  color: var(--accent);
  flex-shrink: 0;
}
.card-preview-name {
  font-family: var(--font-display);
  font-size: 1.1rem;
  font-weight: 600;
}
.card-preview-time {
  font-size: 0.72rem;
  color: var(--text-tertiary);
  margin-top: 2px;
}
</style>
</head>
<body>

<div class="section-subtitle">Liturgia das Horas — Domingo de Páscoa</div>

<div class="tb">
  <!-- Laudes (done) -->
  <div class="tb-item laudes done">
    <div class="tb-label">
      <span class="material-symbols-rounded">check_circle</span>
      Laudes · 6h
    </div>
    <div class="tb-seg"></div>
  </div>

  <!-- Now dot -->
  <div class="tb-now">
    <div class="tb-now-label">Agora</div>
    <div class="tb-now-dot"></div>
  </div>

  <!-- Vésperas (active) -->
  <div class="tb-item vesperas active">
    <div class="tb-label">
      <span class="material-symbols-rounded">wb_sunny</span>
      Vésperas · 18h
    </div>
    <div class="tb-seg"></div>
  </div>

  <!-- Completas (future) -->
  <div class="tb-item completas">
    <div class="tb-label">
      <span class="material-symbols-rounded">nightlight</span>
      Completas · 22h
    </div>
    <div class="tb-seg"></div>
  </div>
</div>

<!-- Card below -->
<div class="card-preview">
  <div class="card-preview-icon">
    <span class="material-symbols-rounded">wb_sunny</span>
  </div>
  <div>
    <div class="card-preview-name">Vésperas</div>
    <div class="card-preview-time">Oração da tarde · 17h–19h</div>
  </div>
  <span class="material-symbols-rounded" style="margin-left:auto;color:var(--text-tertiary)">expand_more</span>
</div>

</body>
</html>
